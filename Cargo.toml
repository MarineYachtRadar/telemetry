[package]
name = "telemetry"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Collector for anonymous mayara usage reports"
license = "Apache-2.0"
readme = "README.md"
publish = false

[[bin]]
name = "telemetry"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["json", "tokio", "http1"] }
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
env_logger = { version = "0.11", default-features = false, features = ["humantime", "auto-color"] }
log = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
