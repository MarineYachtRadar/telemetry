# /docker/nginx/sites-available/telemetry.keversoft.com.conf
#
# The collector is not published on the host: it sits on docker_apps and the
# webserver container reaches it by container name.

# Per-IP request rate. A report is two per mayara run, so anything sustained
# is a mistake; the burst covers a boat whose whole fleet boots at once.
limit_req_zone $binary_remote_addr zone=telemetry:10m rate=1r/s;

#https://telemetry.keversoft.com
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name telemetry.keversoft.com ;

    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/telemetry.keversoft.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/telemetry.keversoft.com/privkey.pem;

    ssl_buffer_size 8k;
    ssl_dhparam /etc/ssl/certs/dhparam-2048.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDH+AESGCM:ECDH+AES256:ECDH+AES128:DH+3DES:!ADH:!AECDH:!MD5;
    ssl_ecdh_curve secp384r1;
    ssl_session_tickets off;
    # OCSP stapling
    # ssl_stapling on;  # disabled 2026-08-10: Let's Encrypt no longer publishes an OCSP responder URL
    # ssl_stapling_verify on;

    resolver 127.0.0.11 valid=10s ipv6=off;   # docker embedded DNS: container names + internet names

    add_header Strict-Transport-Security "max-age=31536000";

    # A report is a few hundred bytes; the collector refuses anything over 20K
    # and nginx should not have carried it that far in the first place.
    client_max_body_size 20k;

    access_log /var/log/nginx/telemetry.access.log;

    location / {
        limit_req zone=telemetry burst=20 nodelay;

        # Through a variable so the name is looked up per request against the
        # resolver above: a literal name in proxy_pass is resolved once at
        # startup, and nginx would keep proxying to a stale address after the
        # collector container is recreated.
        set $collector telemetry;
        proxy_pass http://$collector:8099;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The collector never stores a sender address, but it does rate limit
        # per address, so the peer nginx saw has to reach it. It believes the
        # last entry, which is the one added here.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
