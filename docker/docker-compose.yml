# Collector for telemetry.keversoft.com.
#
# Deployed from a clone at /docker/telemetry:
#
#   docker compose -f docker/docker-compose.yml up -d --build
#
# It joins the existing `docker_apps` network, so the webserver container
# reaches it by name at http://telemetry:8099 and nothing is published on the
# host. The service block below can equally be pasted into the fleet's
# /docker/docker-compose.yml, with `apps` for the network and
# `context: /docker/telemetry` for the build.

# Without this, compose names the project after the directory holding this
# file -- "docker" -- which is the fleet's own project name in /docker. Sharing
# it would make every fleet container an orphan of this project, and a
# `down --remove-orphans` here would take the whole server with it.
name: telemetry

services:
  telemetry:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: telemetry:latest
    # nginx proxies to this name, so it is part of the interface.
    container_name: telemetry
    restart: unless-stopped
    networks:
      - apps
    volumes:
      # The database is the only state. It is owned by uid 1000 in the
      # container, so the host directory has to be too:
      #   install -d -o 1000 -g 1000 /docker-volumes/telemetry
      - /docker-volumes/telemetry:/var/lib/telemetry
    tmpfs:
      - /tmp
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  apps:
    # The network the webserver container is on, created by the compose
    # project in /docker.
    name: docker_apps
    external: true
